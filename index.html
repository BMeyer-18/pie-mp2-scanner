<!doctype html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <title>PIE Scanner</title>
        <link rel="stylesheet" href="./style.css">
    </head>
    <body>
        <h1>PIE Project 2: 2.5D Scanner</h1>
        <h2>River Lewis, Ben Meyer</h2>
        <br>
        <p>Press "CONNECT" button to connect to the Arduino, and follow the instructions. After scanning is done, press "PLOT DATA" to disconnect and plot the scanned points.</p>
        <button id="start">CONNECT</button>
        <button id="stop">PLOT DATA</button>
        <p id="status">Connect Arduino to USB port to begin! Must be in a Chromium-based browser.</p>
        <p id="debugging"></p>

        <div id="plot" ></div>

        <script src="https://cdn.plot.ly/plotly-4.0.0.min.js" charset="utf-8"></script>
        <script src="./script.js"></script>
    </body>
